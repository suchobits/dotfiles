# === Ensure Homebrew bash is found first (needed for plugins requiring bash 4+) ===
set-environment -g PATH "/opt/homebrew/bin:$PATH"

# === General Settings ===
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set-option -g status-position top
set-window-option -g mode-keys vi

# Undercurl support (needed for tokyonight.nvim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# === Prefix ===
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# === Reload ===
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# === Splits ===
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# === Resize ===
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# === vim-tmux-navigator (seamless Ctrl-h/j/k/l between tmux panes and Neovim splits) ===
set -g @plugin 'christoomey/vim-tmux-navigator'

# === TPM Plugins ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect — persist sessions across restarts
set -g @resurrect-capture-pane-contents 'on'

# Continuum — auto-save every 15 min + restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin 'omerxx/tmux-sessionx'

# SessionX Config
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-bind 'o'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-window-mode 'on'

# PowerKit Theme Config — Tokyo Night Night
set -g @powerkit_theme 'tokyo-night'
set -g @powerkit_theme_variant 'night'
set -g @powerkit_session_icon 'auto'
set -g @powerkit_separator_style 'rounded'

# Plugin layout:
#   datetime (external → window-active-base purple to match left side)
#   weather  (regular plugin)
#   cpu+mem  (grouped, dynamic — only visible on threshold)
#   battery  (dynamic colors based on charge level)
#   git      (regular plugin)
set -g @powerkit_plugins 'external("󰥔"|"#(date +%m/%d\ %I:%M\ %p)"|"window-active-base"|"window-active-base-darker"|"5"),weather,group(cpu,memory),battery,git'

# Weather — Charlotte NC, Fahrenheit, compact
set -g @powerkit_plugin_weather_location 'Charlotte'
set -g @powerkit_plugin_weather_format 'compact'
set -g @powerkit_plugin_weather_units 'u'

# Dynamic: CPU, Memory, Battery — hidden until they spike
set -g @powerkit_plugin_cpu_show_only_on_threshold 'true'
set -g @powerkit_plugin_memory_show_only_on_threshold 'true'
set -g @powerkit_plugin_battery_show_only_on_threshold 'false'

# === Initialize TPM (MUST be last line) ===
run '~/.tmux/plugins/tpm/tpm'
