set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# `run` / `#()` inherit the server's PATH, which - when tmux is started
# outside a login shell - can miss the nix and homebrew bin dirs that hold
# the `tmux` binary itself. That makes every plugin bootstrap (`run ...`)
# and status script fail with exit 127 on reload. Prepend them here, before
# any other `run`, so the rest of this file and #() commands resolve tools.
run-shell 'T=$(command -v tmux || echo /run/current-system/sw/bin/tmux); "$T" set-environment -g PATH "/run/current-system/sw/bin:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"'

set-option -g status-position top
set-option -g allow-rename off
set -g extended-keys on
set -g extended-keys-format csi-u

# Claude Code inside tmux: passthrough lets its desktop notifications and
# progress bar reach the outer terminal; the extkeys terminal-feature lets
# tmux tell Shift+Enter from plain Enter so the newline shortcut works.
set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys'
set -g prefix C-s
unbind C-b
bind-key C-s send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Television (tv) popup integration
bind-key C-f display-popup -E -w 70% -h 70% -d '#{pane_current_path}' "tv"
bind-key C-p display-popup -E -w 70% -h 70% -d '#{pane_current_path}' "tv files"

# sesh - session manager / switcher (replaces the default choose-tree on
# prefix + s; capital S keeps the built-in tree). ^t tmux only, ^g configs,
# ^x zoxide dirs, ^f find, ^a all, ^d kill.
bind-key S choose-tree -Zs
bind-key s run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 60%,60% --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' --bind 'tab:down,btab:up' --bind 'ctrl-a:reload(sesh list --icons)' --bind 'ctrl-t:reload(sesh list -t --icons)' --bind 'ctrl-g:reload(sesh list -c --icons)' --bind 'ctrl-x:reload(sesh list -z --icons)' --bind 'ctrl-f:reload(fd -H -d 2 -t d -E .git . ~)' --bind 'ctrl-d:execute(tmux kill-session -t {2..})+reload(sesh list --icons)' --preview-window 'right:55%' --preview 'sesh preview {}')\""

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on
set -s set-clipboard on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'

# Vira Carbon Status Bar Theme (via Catppuccin plugin)
# @thm_* set here before the plugin runs, since it uses -ogq (set-if-unset)
# to load flavor colors -- ours win. "mocha" is just a valid flavor file
# for the plugin to source without erroring; its colors are all overridden below.
# Hex values live in the private dotfiles-vira repo, not here - see its README.
set -g @catppuccin_flavor "mocha"
source-file -q ~/Developer/repos/dotfiles-vira/tmux/vira-carbon.conf

# Window pills use catppuccin's rounded style, chosen at source time - so it
# has to be set before the plugin runs.
set -gq @catppuccin_window_status_style "rounded"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Re-assert message styling AFTER the plugin. The key part is "fill=": on
# tmux 3.7 any custom message-style bg makes the command prompt (prefix + ":")
# only repaint the columns it uses, so the status-right pills bleed through on
# the right. "fill" forces tmux to paint the whole message row.
set -g message-style "bg=#{@thm_message_bg},fg=white,fill=#{@thm_message_bg}"
set -g message-command-style "bg=#{@thm_message_bg},fg=white,fill=#{@thm_message_bg}"

# A blank second status row under the top bar, for a bit of breathing room
# between the pills and the pane content.
# set -g status 2
# set -g status-format[1] ""

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

# Right side: hand-rolled two-tone pills. Each is a pastel accent block
# (rounded left cap + icon) butted against a grey block (#{@thm_overlay_0})
# with light text and a rounded right cap. catppuccin's own modules only
# tint the icon cell, and their default caps are square. Colours use
# #{@thm_x} not #{E:@thm_x}: the E: double-expansion mangles a hex value
# like #RRGGBB (#R is a legacy alias for pane id) and the #[...] is dropped.
set -g  status-right "#[fg=#{@thm_maroon},bg=default]#[fg=#{@thm_crust},bg=#{@thm_maroon}] #[fg=#{@thm_fg},bg=#{@thm_overlay_0}] #{pane_current_command} #[fg=#{@thm_overlay_0},bg=default]"
set -ag status-right "  #[fg=#{?client_prefix,#{@thm_red},#{@thm_green}},bg=default]#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_green}}] #[fg=#{@thm_fg},bg=#{@thm_overlay_0}] #S #[fg=#{@thm_overlay_0},bg=default]"
set -ag status-right "  #[fg=#{@thm_sky},bg=default]#[fg=#{@thm_crust},bg=#{@thm_sky}] #[fg=#{@thm_fg},bg=#{@thm_overlay_0}] %H:%M #[fg=#{@thm_overlay_0},bg=default]"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
